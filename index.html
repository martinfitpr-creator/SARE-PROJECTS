    <!-- Schema.org JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "ConsultingBusiness",
      "name": "SARE Projects Solutions",
      "description": "Compliance, Research & Digital Solutions Firm in South Africa",
      "founder": {
        "@type": "Person",
        "name": "Regina Rikhotso",
        "jobTitle": "Director & Managing Partner"
      },
      "telephone": "+27719506936",
      "email": "sareprojectssolutions@gmail.com",
      "address": {
        "@type": "PostalAddress",
        "addressCountry": "ZA",
        "addressRegion": "South Africa"
      },
      "areaServed": "South Africa",
      "knowsAbout": [
        "Business Compliance Services",
        "CIPC Filing & Tax Returns",
        "Research Support & FGD Moderation",
        "Website Design & Digital Solutions",
        "Grant Proposal & Donor Reporting",
        "Qualitative Data Analysis & NVivo",
        "Community Engagement & Fieldwork Coordination"
      ]
    }
    </script>
  </head>
  <body class="bg-white text-[#111827] font-sans antialiased selection:bg-[#C9962C]/20 selection:text-[#0A2E5C]">
    <!--
      Hidden Netlify Forms — required for build-time detection in React/Vite SPAs.
      Netlify's build bot scans HTML for these during deployment.
      Each React form component has its own local <iframe> as its POST target,
      so no page reload occurs and Netlify still records every submission.
    -->
    <form name="consultation" netlify data-netlify="true" hidden>
      <input type="hidden" name="form-name" value="consultation" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <select name="service-required">
        <option>Website Design &amp; Digital Solutions</option>
        <option>Business Compliance Services</option>
        <option>Research &amp; Transcription Support Services</option>
        <option>Proposal &amp; Donor Support Consulting</option>
        <option>Virtual Executive Assistant Services</option>
        <option>Translation Services</option>
        <option>Qualitative Data Analysis Support</option>
        <option>Community Engagement &amp; Fieldwork Coordination</option>
        <option>General Consultation / Not Sure Yet</option>
      </select>
      <textarea name="message"></textarea>
    </form>

    <form name="contact-page" netlify data-netlify="true" hidden>
      <input type="hidden" name="form-name" value="contact-page" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <input type="text" name="organization" />
      <select name="service-interest">
        <option>Website Design &amp; Digital Solutions</option>
        <option>Business Compliance Services</option>
        <option>Research &amp; Transcription Support Services</option>
        <option>Proposal &amp; Donor Support Consulting</option>
        <option>Virtual Executive Assistant Services</option>
        <option>Translation Services</option>
        <option>Qualitative Data Analysis Support</option>
        <option>Community Engagement &amp; Fieldwork Coordination</option>
      </select>
      <textarea name="message"></textarea>
    </form>

    <form name="contact-section" netlify data-netlify="true" hidden>
      <input type="hidden" name="form-name" value="contact-section" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <input type="text" name="organization" />
      <select name="service-needed">
        <option>Website Design &amp; Digital Solutions</option>
        <option>Business Compliance Services</option>
        <option>Research &amp; Transcription Support Services</option>
        <option>Proposal &amp; Donor Support Consulting</option>
        <option>Virtual Executive Assistant Services</option>
        <option>Translation Services</option>
        <option>Qualitative Data Analysis Support</option>
        <option>Community Engagement &amp; Fieldwork Coordination</option>
        <option>Custom Retainer / Comprehensive Package</option>
      </select>
      <textarea name="message"></textarea>
    </form>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
