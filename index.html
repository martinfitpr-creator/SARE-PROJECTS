<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SARE Projects Solutions | Compliance, Research & Sustainable Growth Consulting</title>
    <meta name="description" content="SARE Projects Solutions led by Director Regina Rikhotso provides premium consulting in Business Compliance, Research Support, Proposal & Donor Support, Virtual EA, and Data Analysis across South Africa." />
    <meta name="keywords" content="SARE Projects Solutions, Regina Rikhotso, Business Compliance South Africa, NGO Support, Donor Proposal Consulting, Research Assistant South Africa, CIPC Filing, Qualitative Data Analysis" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="SARE Projects Solutions | Compliance & Research Consulting" />
    <meta property="og:description" content="Empowering NGOs, Government, Researchers & SMEs with expert compliance, research coordination, and sustainable growth solutions." />
    
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SARE Projects Solutions | Professional Consulting" />
    <meta name="twitter:description" content="Compliance, Research & Sustainable Growth Consulting in South Africa led by Director Regina Rikhotso." />

    <!-- Google Fonts: Poppins & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">

    <!-- Schema.org JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "ConsultingBusiness",
      "name": "SARE Projects Solutions",
      "description": "Compliance, Research & Sustainable Growth Consulting Firm in South Africa",
      "founder": {
        "@type": "Person",
        "name": "Regina Rikhotso",
        "jobTitle": "Director & Managing Partner"
      },
      "telephone": "+27719506936",
      "email": "sareprojectssolutions@gmail.com",
      "address": {
        "@type": "PostalAddress",
        "addressCountry": "ZA",
        "addressRegion": "South Africa"
      },
      "areaServed": "South Africa",
      "knowsAbout": [
        "Business Compliance Services",
        "CIPC Filing & Tax Returns",
        "Research Support & FGD Moderation",
        "Grant Proposal & Donor Reporting",
        "Qualitative Data Analysis & NVivo",
        "Community Engagement & Fieldwork Coordination"
      ]
    }
    </script>
  </head>
  <body class="bg-white text-[#111827] font-sans antialiased selection:bg-[#C9962C]/20 selection:text-[#0A2E5C]">
    <!-- Hidden Netlify Form (required for build-time detection with React SPA) -->
    <form name="consultation" netlify data-netlify="true" hidden>
      <input type="hidden" name="form-name" value="consultation" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <input type="date" name="preferred-date" />
      <select name="service-required">
        <option>Business Compliance Services</option>
        <option>Research Support Services</option>
        <option>Proposal &amp; Donor Support Consulting</option>
        <option>Virtual Executive Assistant Services</option>
        <option>Translation Services</option>
        <option>Qualitative Data Analysis Support</option>
        <option>Community Engagement &amp; Fieldwork Coordination</option>
        <option>General Consultation / Not Sure Yet</option>
      </select>
      <textarea name="message"></textarea>
    </form>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
